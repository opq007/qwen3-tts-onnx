# Qwen3-TTS ONNX 部署服务 — 配置示例
# 复制为 config.yaml 使用；环境变量优先（Q3TTS_API_TOKEN / PORT / DATA_DIR / MODELS_DIR）

server:
  host: 0.0.0.0
  port: 8000
  api_token: ""                # 或设 Q3TTS_API_TOKEN；空=无鉴权模式（本地调试）
  docs_public: true            # /docs Swagger 是否豁免鉴权
  log_level: info
  max_queue_length: 16
  max_upload_mb: 50

storage:
  data_dir: ./data
  task_ttl_seconds: 604800

voice:
  default_voice: ""

audio:
  ffmpeg_path: ffmpeg
  mp3_bitrate: 128k
  max_ref_audio_seconds: 30

models:
  - id: qwen3-tts-0.6b-base
    name: 0.6B Base
    capability: voice_clone
    onnx_dir: ./models/0.6B-Base/cpu_int4
    tts_dir: ./models/0.6B-Base/original
    load_on_start: true
    unload_after_idle_seconds: 0
    max_new_tokens: 2048
    top_k: 50
    top_p: 1.0
    temperature: 0.9
    seed: 0

  - id: qwen3-tts-1.7b-voicedesign
    name: 1.7B VoiceDesign
    capability: voice_design
    onnx_dir: ./models/1.7B-VoiceDesign/cpu_int4
    tts_dir: ./models/1.7B-VoiceDesign/original
    load_on_start: true
    unload_after_idle_seconds: 0
    max_new_tokens: 2048
    top_k: 50
    top_p: 1.0
    temperature: 0.9
    seed: 0